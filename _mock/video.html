<!doctype html><meta charset=utf-8>
<body style="margin:0;width:1200px;height:850px;background:#F4F4F1;font-family:-apple-system,Segoe UI,Roboto,Arial;padding:40px 48px;box-sizing:border-box">
<div style="display:flex;align-items:center;gap:14px">
  <div style="font-size:21px;font-weight:800;color:#0D0C0A">Весільна історія</div>
  <div style="margin-left:auto;display:flex;gap:10px">
    <div style="border:2px solid #E5E3DC;border-radius:999px;padding:10px 22px;font-size:15px;font-weight:700;color:#0D0C0A;display:flex;align-items:center;gap:8px">▶ Слайдшоу</div>
    <div style="background:#2F55FF;border-radius:999px;padding:10px 22px;font-size:15px;font-weight:700;color:#fff">Завантажити</div>
  </div>
</div>
<div style="display:grid;grid-template-columns:2fr 1fr;grid-template-rows:324px 324px;gap:16px;margin-top:24px">
  <div style="position:relative;grid-row:span 2;border-radius:16px;overflow:hidden">
    <img src="../input/photos/gallery-beautiful.jpg" style="width:100%;height:100%;object-fit:cover;display:block">
    <div style="position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center">
      <div style="width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;font-size:36px;padding-left:9px;box-shadow:0 18px 50px rgba(0,0,0,.35)">▶</div>
    </div>
    <div style="position:absolute;left:18px;bottom:16px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:7px 14px;font-size:15px;font-weight:700">▶ Відео · 02:34</div>
  </div>
  <div style="border-radius:16px;overflow:hidden"><img src="../input/photos/gallery-hero.jpg" style="width:100%;height:100%;object-fit:cover;display:block"></div>
  <div style="position:relative;border-radius:16px;overflow:hidden">
    <img src="../input/photos/photo-photographer.jpg" style="width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.55)">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800">+244 фото</div>
  </div>
</div>
</body>
