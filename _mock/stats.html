<!doctype html><meta charset=utf-8>
<body style="margin:0;width:1200px;height:850px;background:#F4F4F1;font-family:-apple-system,Segoe UI,Roboto,Arial;padding:46px 50px;box-sizing:border-box">
<div style="display:flex;align-items:baseline;gap:14px">
  <div style="font-size:22px;font-weight:800;color:#0D0C0A">Весільна історія</div>
  <div style="margin-left:auto;font-size:15px;color:#6F6D66">247 фото · опубліковано</div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px">
  <div style="background:#fff;border:1px solid #E5E3DC;border-radius:16px;padding:22px 24px">
    <div style="font-size:14px;font-weight:700;color:#6F6D66;letter-spacing:1px">ПЕРЕГЛЯДИ</div>
    <div style="font-size:44px;font-weight:800;color:#0D0C0A;margin-top:6px">184</div>
  </div>
  <div style="background:#fff;border:1px solid #E5E3DC;border-radius:16px;padding:22px 24px">
    <div style="font-size:14px;font-weight:700;color:#6F6D66;letter-spacing:1px">ЗАВАНТАЖЕНЬ</div>
    <div style="font-size:44px;font-weight:800;color:#0D0C0A;margin-top:6px">57</div>
  </div>
  <div style="background:#fff;border:1px solid #E5E3DC;border-radius:16px;padding:22px 24px">
    <div style="font-size:14px;font-weight:700;color:#6F6D66;letter-spacing:1px">ОБРАНІ ♥</div>
    <div style="font-size:44px;font-weight:800;color:#2F55FF;margin-top:6px">32</div>
  </div>
</div>
<div style="background:#fff;border:1px solid #E5E3DC;border-radius:16px;padding:24px;margin-top:16px">
  <div style="font-size:15px;font-weight:700;color:#0D0C0A;margin-bottom:16px">Статистика по фото</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
    <div>
      <div style="border-radius:12px;overflow:hidden"><img src="../input/photos/gallery-hero.jpg" style="width:100%;height:150px;object-fit:cover;display:block"></div>
      <div style="font-size:14px;color:#6F6D66;margin-top:8px">👁 41 · ⬇ 12 · <span style="color:#2F55FF">♥</span></div>
    </div>
    <div>
      <div style="border-radius:12px;overflow:hidden"><img src="../input/photos/gallery-beautiful.jpg" style="width:100%;height:150px;object-fit:cover;display:block"></div>
      <div style="font-size:14px;color:#6F6D66;margin-top:8px">👁 36 · ⬇ 9 · <span style="color:#2F55FF">♥</span></div>
    </div>
    <div>
      <div style="border-radius:12px;overflow:hidden"><img src="../input/photos/photo-photographer.jpg" style="width:100%;height:150px;object-fit:cover;display:block"></div>
      <div style="font-size:14px;color:#6F6D66;margin-top:8px">👁 29 · ⬇ 7</div>
    </div>
    <div>
      <div style="position:relative;border-radius:12px;overflow:hidden">
        <img src="../input/photos/gallery-hero.jpg" style="width:100%;height:150px;object-fit:cover;display:block;filter:brightness(.45) grayscale(.3)">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:800">+244</div>
      </div>
      <div style="font-size:14px;color:#6F6D66;margin-top:8px">усі фото →</div>
    </div>
  </div>
</div>
<div style="display:flex;align-items:center;gap:10px;margin-top:16px;font-size:15px;color:#6F6D66">
  <span style="background:#EEF2FF;color:#2F55FF;font-weight:800;border-radius:999px;padding:6px 14px;font-size:13px">ПЛЮС</span>
  <span>Доступно на тарифах Плюс і Максимальний</span>
</div>
</body>
