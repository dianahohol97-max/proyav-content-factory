name: build-content

on:
  schedule:
    - cron: "0 5 * * 1"      # weekly, Monday 05:00 UTC — refresh carousels & queue
  workflow_dispatch: {}

concurrency:
  group: build-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch brand fonts
        run: |
          mkdir -p fonts
          curl -sSLg -o fonts/Unbounded.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf"
          curl -sSLg -o fonts/Manrope.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf"
          curl -sSLg -o fonts/Playfair.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
          curl -sSLg -o fonts/PlayfairItalic.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay-Italic%5Bwght%5D.ttf"

      - name: Generate carousels + queue
        run: python build.py

      - name: Commit generated media & queue
        run: |
          git config user.name "proyav-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output queue
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh carousels & queue [skip ci]"
            git push
          fi
